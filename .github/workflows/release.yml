name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  goreleaser:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.27.x'
        cache: true

    - name: Build static binary
      run: |
        mkdir -p dist
        CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w -X main.version=${{ github.ref_name }}" -o dist/rpt ./cmd/rpt
        tar -czvf dist/rpt-linux-amd64-${{ github.ref_name }}.tar.gz -C dist rpt

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: dist/*.tar.gz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
