name: Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.27.x'
        cache: true

    - name: Verify dependencies
      run: go mod verify

    - name: Run linter
      run: go vet ./...

    - name: Run automated test suite
      run: go test -v -race -coverprofile=coverage.txt ./...

    - name: Build binary
      run: make build
